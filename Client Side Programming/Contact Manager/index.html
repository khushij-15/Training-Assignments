<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (injected by JS) -->
  <div id="navbar-placeholder"></div>

  <div class="container">

    <!-- STATS ROW -->
    <div class="row stats-row">
      <div class="col-xs-4">
        <div class="stat-card">
          <p class="stat-label">Total Contacts</p>
          <p class="stat-value" id="totalCount">0</p>
        </div>
      </div>
      <div class="col-xs-4">
        <div class="stat-card">
          <p class="stat-label">Work</p>
          <p class="stat-value" id="workCount">0</p>
        </div>
      </div>
      <div class="col-xs-4">
        <div class="stat-card">
          <p class="stat-label">Friends &amp; Family</p>
          <p class="stat-value" id="otherCount">0</p>
        </div>
      </div>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-bar">
      <div class="input-group">
        <input type="text" id="searchInput" class="form-control"
          placeholder="Search by name, email or phone..." oninput="searchContacts()">
        <span class="input-group-btn">
          <button class="btn btn-default" type="button">
            <span class="glyphicon glyphicon-search"></span> Search
          </button>
        </span>
      </div>
    </div>

    <!-- CONTACTS TABLE -->
    <div class="table-responsive contacts-table">
      <table class="table table-hover" id="contactsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="contactsBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state">
        <p>No contacts found.</p>
        <a href="form.html" class="btn btn-primary">Add your first contact</a>
      </div>
    </div>

  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
